name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────
  # LINT & VALIDATE
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Validate project structure and run Lua tests
        run: ./build.sh lua-test

  # ──────────────────────────────────────────────
  # BUILD .LOVE ARCHIVE
  # ──────────────────────────────────────────────
  build:
    name: Build .love
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .love archive
        run: ./build.sh love

      - name: Upload .love artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-legends-love
          path: dist/*.love
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # RUN TESTS (requires display via xvfb)
  # ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LÖVE + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb software-properties-common
          sudo add-apt-repository -y ppa:bartbes/love-stable
          sudo apt-get update
          sudo apt-get install -y love

      - name: Run tests (from source)
        run: timeout 60 xvfb-run love . --test

      - name: Run tests (from .love artifact)
        uses: actions/download-artifact@v4
        with:
          name: apex-legends-love
          path: dist

      - name: Run tests on built artifact
        run: timeout 60 xvfb-run love dist/apex-legends.love --test

  # ──────────────────────────────────────────────
  # BUILD FOR ANDROID (manual trigger planned)
  # ──────────────────────────────────────────────
  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Download .love artifact
        uses: actions/download-artifact@v4
        with:
          name: apex-legends-love
          path: dist

      - name: Build Android APK
        run: ./build.sh android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-legends-android
          path: dist/*.apk
          if-no-files-found: warn
