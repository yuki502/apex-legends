name: Build APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly build

env:
  JAVA_VERSION: '11'
  NDK_VERSION: '25.0.8775105'
  BUILD_TOOLS_VERSION: '31.0.0'
  API_LEVEL: '31'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-levels: ${{ env.API_LEVEL }}
        ndk-version: ${{ env.NDK_VERSION }}
        build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}
    
    - name: Clone LÖVE Android
      run: |
        git clone https://github.com/love2d/love-android.git
        cd love-android
        git submodule update --init --recursive
      continue-on-error: true
    
    - name: Copy game files
      run: |
        mkdir -p love-android/app/src/main/assets/game
        cp -r conf.lua main.lua lib src assets love-android/app/src/main/assets/game/ || true
      continue-on-error: true
    
    - name: Build Debug APK
      run: |
        cd love-android
        chmod +x gradlew
        ./gradlew assembleDebug 2>&1 | tee build-debug.log
      continue-on-error: true
    
    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: apex-legends-debug
        path: love-android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Save Build Errors (Debug)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs-debug
        path: love-android/build-debug.log
        retention-days: 7
    
    - name: Comment on PR - Debug Success
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Debug APK build successful! Download from Artifacts.'
          })
    
    - name: Comment on PR - Debug Failed
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Debug APK build failed! Check build-error-logs-debug artifact.'
          })

  build-release:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-levels: ${{ env.API_LEVEL }}
        ndk-version: ${{ env.NDK_VERSION }}
        build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}
    
    - name: Clone LÖVE Android
      run: |
        git clone https://github.com/love2d/love-android.git
        cd love-android
        git submodule update --init --recursive
      continue-on-error: true
    
    - name: Copy game files
      run: |
        mkdir -p love-android/app/src/main/assets/game
        cp -r conf.lua main.lua lib src assets love-android/app/src/main/assets/game/ || true
      continue-on-error: true
    
    - name: Build Release APK
      run: |
        cd love-android
        chmod +x gradlew
        ./gradlew assembleRelease 2>&1 | tee build-release.log
      continue-on-error: true
    
    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: apex-legends-release
        path: love-android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
    
    - name: Save Build Errors (Release)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs-release
        path: love-android/build-release.log
        retention-days: 7
    
    - name: Comment on PR - Release Success
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Release APK build successful! Download from Artifacts.'
          })
    
    - name: Comment on PR - Release Failed
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Release APK build failed! Check build-error-logs-release artifact.'
          })

  create-release:
    needs: [build-debug, build-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: apex-legends-debug
        path: ./artifacts
    
    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: apex-legends-release
        path: ./artifacts
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
    
    - name: Upload Debug APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./artifacts/app-debug.apk
        asset_name: apex-legends-${{ github.ref_name }}-debug.apk
        asset_content_type: application/vnd.android.package-archive
      continue-on-error: true
    
    - name: Upload Release APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./artifacts/app-release.apk
        asset_name: apex-legends-${{ github.ref_name }}-release.apk
        asset_content_type: application/vnd.android.package-archive
      continue-on-error: true

  notify-status:
    needs: [build-debug, build-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Build Status Summary
      run: |
        echo "## 📦 Build Status Report" >> $GITHUB_STEP_SUMMARY
        echo "- Debug Build: ${{ needs.build-debug.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Release Build: ${{ needs.build-release.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Workflow Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
