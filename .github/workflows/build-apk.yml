name: Build APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '27.3.13750724'
  API_LEVEL: '35'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk-headless zip unzip
        java -version
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Install Android SDK
      uses: android-actions/setup-android@v4

    - name: Install NDK and SDK
      run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "platforms;android-${{ env.API_LEVEL }}" "build-tools;${{ env.API_LEVEL }}.0.0" "cmake;3.22.1"

    - name: Package .love archive
      run: zip -9 -r /tmp/game.love . -x ".git/*" ".github/*" "*.log" "dist/*" "android/*" "node_modules/*"

    - name: Clone love-android
      run: git clone --depth 1 --recurse-submodules --shallow-submodules --branch main https://github.com/love2d/love-android.git love-android && rm -rf love-android/.git

    - name: Copy game files
      run: mkdir -p love-android/app/src/embed/assets && cp /tmp/game.love love-android/app/src/embed/assets/game.love

    - name: Configure gradle.properties
      run: printf 'app.name=Apex Legends\napp.application_id=com.apexlegends.spaceshooter\napp.orientation=landscape\napp.version_code=1\napp.version_name=1.0.0\nandroid.enableJetifier=false\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nandroid.nonFinalResIds=true\nandroid.dependency.useConstraints=true\n' > love-android/gradle.properties

    - name: Build Debug APK
      run: cd love-android && chmod +x gradlew && ./gradlew assembleEmbedNoRecordDebug 2>&1 | tee build-debug.log
      continue-on-error: true

    - name: List APK files
      run: find love-android -name "*.apk" 2>/dev/null || echo "No APK files found"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: apex-legends-debug
        path: love-android/app/build/outputs/apk/**/*.apk
        retention-days: 30

    - name: Upload Build Errors (Debug)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs-debug
        path: love-android/build-debug.log
        retention-days: 7

  build-release:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk-headless zip unzip
        java -version
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

    - name: Install Android SDK
      uses: android-actions/setup-android@v4

    - name: Install NDK and SDK
      run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "platforms;android-${{ env.API_LEVEL }}" "build-tools;${{ env.API_LEVEL }}.0.0" "cmake;3.22.1"

    - name: Package .love archive
      run: zip -9 -r /tmp/game.love . -x ".git/*" ".github/*" "*.log" "dist/*" "android/*" "node_modules/*"

    - name: Clone love-android
      run: git clone --depth 1 --recurse-submodules --shallow-submodules --branch main https://github.com/love2d/love-android.git love-android && rm -rf love-android/.git

    - name: Copy game files
      run: mkdir -p love-android/app/src/embed/assets && cp /tmp/game.love love-android/app/src/embed/assets/game.love

    - name: Configure gradle.properties
      run: printf 'app.name=Apex Legends\napp.application_id=com.apexlegends.spaceshooter\napp.orientation=landscape\napp.version_code=1\napp.version_name=1.0.0\nandroid.enableJetifier=false\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nandroid.nonFinalResIds=true\nandroid.dependency.useConstraints=true\n' > love-android/gradle.properties

    - name: Generate debug keystore
      run: keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"

    - name: Configure signing
      run: printf 'android { signingConfigs { debug { storeFile file("/tmp/debug.keystore") storePassword "android" keyAlias "androiddebugkey" keyPassword "android" } } buildTypes.release.signingConfig signingConfigs.debug }' >> love-android/app/build.gradle

    - name: Build Release APK
      run: cd love-android && chmod +x gradlew && ./gradlew assembleEmbedNoRecordRelease 2>&1 | tee build-release.log
      continue-on-error: true

    - name: List APK files
      run: find love-android -name "*.apk" 2>/dev/null || echo "No APK files found"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: apex-legends-release
        path: love-android/app/build/outputs/apk/**/*.apk
        retention-days: 30

    - name: Upload Build Errors (Release)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs-release
        path: love-android/build-release.log
        retention-days: 7

  notify-status:
    needs: [build-debug, build-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Build Status Summary
      run: |
        echo "## Build Status Report" >> $GITHUB_STEP_SUMMARY
        echo "- Debug: ${{ needs.build-debug.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Release: ${{ needs.build-release.result }}" >> $GITHUB_STEP_SUMMARY
